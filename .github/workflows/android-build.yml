name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'index.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'ui-tuning.json'
      - 'src/**'
      - 'assets/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read app version
        id: app_version
        shell: bash
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk shici-recite-app-v${{ steps.app_version.outputs.version }}.apk

      - name: Record APK size in update manifest
        env:
          APK_PATH: shici-recite-app-v${{ steps.app_version.outputs.version }}.apk
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('version.json', 'utf8').replace(/^\uFEFF/, ''));
          manifest.size = fs.statSync(process.env.APK_PATH).size;
          fs.writeFileSync('version.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record v${APP_VERSION} apk size [skip ci]"
          git push origin HEAD:main

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shici-recite-app-v${{ steps.app_version.outputs.version }}
          path: shici-recite-app-v${{ steps.app_version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: 诗词背诵 v${{ steps.app_version.outputs.version }}
          body: |
            本次更新重点修复导航卡顿与背诵记录准确性。

            - 底部页面按需加载，背诵候选只计算实际需要的篇目，避免反复排序两万余篇作品。
            - 修复答对一句就可能提前记成整首已背的问题；退出专注背诵前会提示未完成进度。
            - “换一换”恢复真正随机并排除当前篇目。
            - 修复诗库筛选高亮、50 条截断提示、搜索卡顿和联网补录反馈。
            - 修复创作页布局、词牌草稿恢复、评分提示及多处异常问号文本。

            安装包名称：shici-recite-app-v${{ steps.app_version.outputs.version }}.apk
          files: shici-recite-app-v${{ steps.app_version.outputs.version }}.apk
          make_latest: true
