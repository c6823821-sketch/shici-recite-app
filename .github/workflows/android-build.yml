name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'index.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'ui-tuning.json'
      - 'src/**'
      - 'assets/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read app version
        id: app_version
        shell: bash
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk shici-recite-app-v${{ steps.app_version.outputs.version }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shici-recite-app-v${{ steps.app_version.outputs.version }}
          path: shici-recite-app-v${{ steps.app_version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: 诗词背诵 v${{ steps.app_version.outputs.version }}
          body: |
            修复背诵选题、搜索和版本显示体验。

            本次更新：每日背诵优先短篇与名篇，不再直接推《离骚》等长文；搜索作者会直接进入作者结果；宋词会补首句帮助区分；版本号统一为三段式。

            安装包名称：shici-recite-app-v${{ steps.app_version.outputs.version }}.apk
          files: shici-recite-app-v${{ steps.app_version.outputs.version }}.apk
          make_latest: true
