name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'index.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'ui-tuning.json'
      - 'src/**'
      - 'assets/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk shici-recite-app-v3.0.29.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shici-recite-app-v3.0.29
          path: shici-recite-app-v3.0.29.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.29
          name: 诗词背诵 v3.0.29
          body: |
            诗词背诵 Android 测试版。

            搜索框改为 View 同行布局，放大镜和文字绝不再换行。

            秋日应景卡片外层用 View 绘制边框和背景，Pressable 只作透明点击层。

            安装后可在“我的 → 检查更新”确认当前版本为 v3.0.29。
          files: shici-recite-app-v3.0.29.apk
          make_latest: true
