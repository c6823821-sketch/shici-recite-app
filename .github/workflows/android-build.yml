name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'index.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'ui-tuning.json'
      - 'src/**'
      - 'assets/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk shici-recite-app-v3.0.30.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shici-recite-app-v3.0.30
          path: shici-recite-app-v3.0.30.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.30
          name: 诗词背诵 v3.0.30
          body: |
            诗词背诵 Android 测试版。

            新增全局长文引擎：长诗、离骚、长恨歌等自动按语义分节。

            阅读进度自动保存，下次打开可从上次单元继续。

            选字后底部固定显示“解释所选 / 整句 / 取消”，不再需要滑到段落底部。

            安装后可在“我的 → 检查更新”确认当前版本为 v3.0.30。
          files: shici-recite-app-v3.0.30.apk
          make_latest: true
