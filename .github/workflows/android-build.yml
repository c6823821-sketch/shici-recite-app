name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'index.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'assets/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk shici-recite-app-v3.0.11.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shici-recite-app-v3.0.11
          path: shici-recite-app-v3.0.11.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.11
          name: 诗词背诵 v3.0.11
          body: |
            诗词背诵 Android 测试版。

            修复词牌 API 补录时中文名称导致的缓存错误；本地没有的词牌可正常搜索并补录。

            此版本是自包含 release APK，安装后无需连接电脑。
          files: shici-recite-app-v3.0.11.apk
          make_latest: true
